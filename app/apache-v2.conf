<VirtualHost *:80>
    ServerName localhost

    RewriteEngine On
    RewriteRule ^/(.*)$ https://localhost:8443/$1 [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/v2-http-error.log
    CustomLog ${APACHE_LOG_DIR}/v2-http-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ServerSignature Off
    TraceEnable Off

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cache-Control "no-store, no-cache, must-revalidate"
    Header always set Pragma "no-cache"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

    # HSTS se omite intencionalmente porque V1 usa HTTP en localhost:8081.
    # HSTS es por hostname, no por puerto, y rompería la comparación simultánea.

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/v2-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/v2-ssl-access.log combined
</VirtualHost>
